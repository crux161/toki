# toki theme configuration
#
# Colours are RRGGBB hex, optionally 0x-prefixed or written as AARRGGBB (the
# alpha byte is ignored, since minifb's macOS layer is opaque). Do not prefix a
# colour with '#', which starts a comment in this format. The values below are
# taken from the table in theme_proposal.md section 3.
#
# Delete this file to fall back to the built-in default: green on dark grey.
# Also searched at ~/.config/toki/config if ./toki.conf is absent.

# Which of the themes below to use.
theme = cyber_phosphor

# Post-processing, applied to the whole frame after the glyphs are drawn.
# scanlines dims every odd row by 15%; vignette fades the corners to 50%.
scanlines = on
vignette = off

# Modern Timex Indiglo backlight; crisp and legible.
[indiglo_cyan]
foreground = 4AF6C3
background = 0A1118

# Classic calculator and amber monochrome CRT phosphor.
[vintage_amber]
foreground = FF9933
background = 120A02

# High-contrast military terminal / tactical HUD green.
[cyber_phosphor]
foreground = 00FF66
background = 030A05

# Sleek modern digital watch face with metallic contrast.
[monochrome_lcd]
foreground = E0E0E0
background = 1C1C1C
